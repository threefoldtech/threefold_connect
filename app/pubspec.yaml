name: threebotlogin
description: A decentralized login application

publish_to: "none"

version: 4.2.2+190

environment:
  sdk: ">=3.4.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_pkid:
    git:
      url: https://github.com/threefoldtech/threefold_connect_flutter_pkid_client
      ref: master
  tfchain_client:
