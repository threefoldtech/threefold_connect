  path_provider: ^2.1.5
  dio: ^5.7.0
  open_file: ^3.5.10
  pinenacl: ^0.6.0
  pinput: ^5.0.1
  build_runner: ^2.4.13
  smooth_page_indicator: ^1.2.0+3
  webview_flutter: ^4.10.0
  qr_flutter: ^4.1.0
  screen_brightness: ^2.1.1
  validators: ^3.0.0
  lottie: ^3.3.1
  crisp_chat: ^2.2.3
  xml2json: ^6.2.6
  timeago: ^3.7.0
