[tool.poetry]
name = "threefold-connect-backend"
version = "2.0.0"
description = "ThreeFold Connect Backend - Authentication and Digital Twin Management"
authors = ["ThreeFold Tech"]
readme = "README.md"
packages = [{include = "*.py"}]

[tool.poetry.dependencies]
python = "^3.11"
flask = "^3.1.0"
flask-cors = "^5.0.0"
flask-restful = "^0.3.10"
flask-socketio = "^5.4.1"
python-socketio = "^5.12.0"
python-engineio = "^4.10.1"
gevent = "^24.11.1"
gevent-websocket = "^0.10.1"
sqlalchemy = "^2.0.36"
pynacl = "^1.5.0"
requests = "^2.32.3"
requests-toolbelt = "^1.0.0"
stellar-sdk = "^9.2.0"
uwsgi = "^2.0.28"
werkzeug = "^3.1.3"
click = "^8.1.8"
jinja2 = "^3.1.4"
markupsafe = "^3.0.2"
markdown = "^3.7"
certifi = "^2024.12.14"
cffi = "^1.17.1"
cryptography = "^44.0.0"
idna = "^3.10"
itsdangerous = "^2.2.0"
pytz = "^2024.2"
six = "^1.17.0"
urllib3 = "^2.3.0"
nanoid = "^2.0.0"
mnemonic = "^0.20"
pyfcm = "^1.5.4"
greenlet = "^3.1.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-cov = "^6.0.0"
black = "^24.10.0"
flake8 = "^7.1.1"
mypy = "^1.13.0"
isort = "^5.13.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=. --cov-report=term-missing"
